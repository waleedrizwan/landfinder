<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Land Finder: live</title>
<style>
  :root { --bg: #f6f5f1; --card: #fff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1da; --accent: #2f6b4f; --accent-2: #d9efe3;
          --warn: #b4531f; --bad: #b42318; --mono: ui-monospace, SFMono-Regular, Menlo, monospace; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15161a; --card: #1e2026; --ink: #ecebe6; --muted: #9a998f; --line: #2d3038; --accent: #7fc9a2; --accent-2: #203a2d;
            --warn: #e58a55; --bad: #f08c85; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px; margin-bottom: 14px; }
  h1 { font-size: 22px; margin: 0; }
  .phase { padding: 2px 10px; border-radius: 999px; background: var(--accent-2); color: var(--accent); font-weight: 600; font-size: 13px; }
  .phase.off { background: var(--line); color: var(--muted); }
  .meta { color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  button:hover { border-color: var(--bad); color: var(--bad); }
  button[disabled] { opacity: .5; cursor: default; }
  .bar { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; margin: 6px 0 4px; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .6s; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 16px 0; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .stat b { display: block; font-size: 22px; font-weight: 600; }
  .stat span { color: var(--muted); font-size: 12px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 8px; }
  .workers { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .w { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 74px; }
  .w.idle { opacity: .55; }
  .w .n { font-weight: 600; display: flex; justify-content: space-between; }
  .w .n small { color: var(--muted); font-weight: 400; }
  .w .l { margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .w .u { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); }
  .w .slow { color: var(--warn); }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { padding: 7px 10px; text-align: right; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; border-top: 0; }
  td:first-child, th:first-child { text-align: left; }
  td.bad { color: var(--bad); font-weight: 600; }
  pre { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: 12.5px/1.5 var(--mono);
        max-height: 360px; overflow: auto; white-space: pre-wrap; margin: 0; }
  .banner { display: none; padding: 10px 14px; border-radius: 10px; background: var(--accent-2); color: var(--accent); margin-bottom: 14px; }
  .banner.show { display: block; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Land Finder</h1>
    <span class="phase off" id="phase">starting</span>
    <span class="meta" id="meta"></span>
    <span class="spacer"></span>
    <button id="stop" title="Finish the pages in progress, save, then build the site from what was collected">Stop the run</button>
  </header>
  <div class="banner" id="banner"></div>
  <div class="bar"><div id="bar"></div></div>
  <div class="meta" id="jobs"></div>

  <div class="stats">
    <div class="stat"><b id="s-pages">0</b><span>pages fetched</span></div>
    <div class="stat"><b id="s-rate">0</b><span>pages in the last minute</span></div>
    <div class="stat"><b id="s-new">0</b><span>new listings this run</span></div>
    <div class="stat"><b id="s-disk">–</b><span>listings on disk</span></div>
    <div class="stat"><b id="s-bad">0</b><span>failed / blocked pages</span></div>
  </div>

  <h2>Windows and threads</h2>
  <div class="workers" id="workers"></div>

  <h2>Sites</h2>
  <table>
    <thead><tr><th>site</th><th>via</th><th>pages</th><th>last min</th><th>verify</th><th>failed</th><th>blocked</th><th>s / page</th><th>new listings</th></tr></thead>
    <tbody id="sites"></tbody>
  </table>

  <h2>Log</h2>
  <pre id="log"></pre>
</main>
<script>
  const $ = id => document.getElementById(id);
  const mins = s => s == null ? '–' : s < 60 ? s + 's' : s < 3600 ? Math.floor(s / 60) + 'm ' + String(s % 60).padStart(2, '0') + 's'
                                  : Math.floor(s / 3600) + 'h ' + String(Math.floor(s % 3600 / 60)).padStart(2, '0') + 'm';
  const esc = s => String(s).replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
  let misses = 0, stopped = false;

  function render(d) {
    const ph = $('phase');
    ph.textContent = d.stopping ? 'stopping' : (d.phase || 'between phases');
    ph.className = 'phase' + (d.phase && !d.stopping ? '' : ' off');
    $('meta').textContent = `started ${d.started} · ${mins(d.elapsed_s)} elapsed` + (d.eta_s ? ` · roughly ${mins(d.eta_s)} of searching left` : '')
                            + (d.args ? ` · ${d.args}` : '');
    const j = d.jobs, pct = j.total ? Math.round(100 * j.done / j.total) : 0;
    $('bar').style.width = pct + '%';
    $('jobs').textContent = j.total ? `${j.done} of ${j.total} searches done (${pct}%): a search is one site's land or house section in one country, state or province`
                                    : 'no browser searches queued yet';
    const S = d.sites;
    $('s-pages').textContent = S.reduce((a, s) => a + s.pages, 0);
    $('s-rate').textContent = S.reduce((a, s) => a + s.recent, 0);
    $('s-new').textContent = d.listings_new.toLocaleString();
    $('s-disk').textContent = d.on_disk == null ? '–' : d.on_disk.toLocaleString();
    const bad = S.reduce((a, s) => a + s.failed, 0), blocked = S.reduce((a, s) => a + s.blocked, 0);
    $('s-bad').textContent = `${bad} / ${blocked}`;
    $('s-bad').style.color = bad + blocked ? 'var(--bad)' : '';

    $('workers').innerHTML = d.workers.map(w => {
      const slow = w.busy && w.since_s > 45;
      const note = w.busy ? (w.what === 'verify' ? 'verifying · ' : '') + (slow ? `<span class="slow">${w.since_s}s on this page</span>` : `${w.since_s}s`) : '';
      const label = w.label === w.url ? w.url.replace(/^https?:\/\/(www\.)?/, '') : w.label;
      return `<div class="w${w.busy ? '' : ' idle'}"><div class="n">${esc(w.name)} <small>${w.pages} pages${note ? ' · ' + note : ''}</small></div>
              <div class="l">${esc(label)}</div>${w.url && w.label !== w.url ? `<div class="u">${esc(w.url.replace(/^https?:\/\/(www\.)?/, ''))}</div>` : ''}</div>`;
    }).join('') || '<div class="meta">nothing fetching yet</div>';

    $('sites').innerHTML = S.map(s => `<tr><td>${esc(s.source)}</td><td>${esc(s.via)}</td><td>${s.pages}</td><td>${s.recent}</td><td>${s.verify}</td>
        <td class="${s.failed ? 'bad' : ''}">${s.failed}</td><td class="${s.blocked ? 'bad' : ''}">${s.blocked}</td>
        <td>${s.pages ? (s.secs / s.pages).toFixed(1) : '–'}</td><td>${s.new.toLocaleString()}</td></tr>`).join('')
        || '<tr><td colspan="9" class="meta">no pages yet</td></tr>';

    const log = $('log'), atEnd = log.scrollHeight - log.scrollTop - log.clientHeight < 30;
    log.textContent = d.log.join('\n');
    if (atEnd) log.scrollTop = log.scrollHeight;
    $('stop').disabled = d.stopping;
    $('stop').textContent = d.stopping ? 'Stopping…' : 'Stop the run';
  }

  async function poll() {
    try {
      const r = await fetch('/progress.json', {cache: 'no-store'});
      render(await r.json());
      misses = 0;
      $('banner').className = 'banner';
    } catch (e) {
      if (++misses >= 3) {
        $('banner').textContent = 'The run has ended (or the scraper is not running): this page is no longer updating. The log in the Terminal window has the summary.';
        $('banner').className = 'banner show';
        $('phase').textContent = 'ended';
        $('phase').className = 'phase off';
      }
    }
  }
  $('stop').onclick = async () => {
    if (!confirm('Stop the run? Pages in progress finish, everything collected so far is saved, and the site is built from it.')) return;
    $('stop').disabled = true;
    await fetch('/stop', {method: 'POST'});
  };
  poll();
  setInterval(poll, 2000);
</script>
</body>
</html>
