<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cheapest Land — C: Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Direction C: the map and the list on one screen, and the filters read as one sentence.
   Where the land is matters as much as its price, so you shouldn't have to switch tabs to see it.
   Pins use survey magenta, the colour boundary lines are printed in on cadastral maps. */
:root{
  --bg:#ffffff; --ink:#1c1f24; --soft:#646b76; --rule:#e4e6ea; --tint:#f4f5f7;
  --mag:#a8186f; --mag-soft:#fbe9f3; --warn:#9b4a12;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#17191d; --ink:#e7e9ec; --soft:#9aa1ab; --rule:#2c3036; --tint:#1f2227; --mag:#f06ab3; --mag-soft:#3a1d2d; --warn:#eba06b;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Hanken Grotesk",system-ui,sans-serif;font-variant-numeric:tabular-nums;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--mag);outline-offset:2px}

header{display:flex;align-items:center;gap:20px;padding:14px 24px;border-bottom:1px solid var(--rule)}
.brand{font-weight:800;font-size:17px}
.sentence{font-size:clamp(19px,2.2vw,26px);font-weight:500;letter-spacing:-.01em;margin:0}
.sentence select{font:inherit;font-weight:700;color:var(--mag);background:none;border:0;border-bottom:2px dotted var(--mag);padding:0 2px;cursor:pointer;appearance:none;-webkit-appearance:none}
.sentence select:focus-visible{outline:2px solid var(--mag);outline-offset:3px;border-radius:2px}
.right{margin-left:auto;display:flex;gap:10px;align-items:center}
.right input{font:inherit;color:var(--ink);background:var(--tint);border:1px solid transparent;border-radius:6px;padding:8px 11px;width:220px}
.right input:focus{border-color:var(--mag);outline:0;background:var(--bg)}
.right button{font:inherit;color:var(--ink);background:none;border:1px solid var(--rule);border-radius:6px;padding:7px 11px;cursor:pointer}

.split{flex:1;display:grid;grid-template-columns:430px 1fr;min-height:0}
.list{overflow:auto;border-right:1px solid var(--rule)}
.count{position:sticky;top:0;background:var(--bg);padding:12px 20px;border-bottom:1px solid var(--rule);color:var(--soft);font-size:14px;z-index:2;display:flex;justify-content:space-between}
.count b{color:var(--ink)}
.item{display:grid;grid-template-columns:86px 1fr;gap:4px 14px;padding:14px 20px;border-bottom:1px solid var(--rule);cursor:pointer}
.item:hover,.item.on{background:var(--mag-soft)}
.price{font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.own{font-size:12px;color:var(--soft)}
.place{font-weight:600}
.t{color:var(--soft);font-size:14px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:13px;color:var(--soft);grid-column:2}
.meta .tag{color:var(--warn);font-weight:700}
.item .open{grid-column:2;font-size:14px;font-weight:600;color:var(--mag);display:none}
.item.on .open{display:block}
#map{min-height:0;background:var(--tint)}
.pin div{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;background:var(--bg);color:var(--ink);border:1.5px solid var(--mag);border-radius:4px;padding:3px 6px;font:700 12px/1 "Hanken Grotesk",sans-serif;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.pin div::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-5px;border:5px solid transparent;border-top-color:var(--mag);border-bottom:0}
.pin.on div{background:var(--mag);color:#fff;z-index:1000}
.leaflet-container{font-family:"Hanken Grotesk",sans-serif}
/* a grey map, so the magenta prices are the only colour on it */
.leaflet-tile-pane{filter:grayscale(1) contrast(.85) brightness(1.06)}
@media (prefers-color-scheme:dark){.leaflet-tile-pane{filter:grayscale(1) invert(1) brightness(.8) contrast(.9)}}

@media (max-width:860px){
  header{flex-wrap:wrap;padding:12px 16px;gap:10px}
  .right{margin-left:0;width:100%}
  .right input{flex:1;width:auto}
  .split{display:flex;flex-direction:column-reverse}
  #map{height:42vh;flex:none}
  .list{border-right:0}
  .item{padding:12px 16px}
  .count span+span{display:none}
}
</style>
</head>
<body>
<header>
  <div class="brand">Cheapest Land</div>
  <p class="sentence">
    <select id="type" aria-label="Type of property"><option value="">Any land</option><option value="VR">Vacant land</option><option value="F">Farmland</option><option value="L">Building lots</option><option value="BGH">Land with a house</option></select>
    under
    <select id="max" aria-label="Highest price"><option value="1000">$1,000</option><option value="2000" selected>$2,000</option><option value="5000">$5,000</option><option value="1e12">any price</option></select>
    in
    <select id="where" aria-label="Where"><option value="">the world</option><option>Europe</option><option>Asia</option><option>North America</option><option>South America</option><option>Africa</option></select>
  </p>
  <div class="right">
    <input id="q" type="search" placeholder="Town or country" aria-label="Search">
    <button type="button">More filters</button>
  </div>
</header>

<div class="split">
  <div class="list"><div class="count" id="count"></div><div id="items"></div></div>
  <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="sample.js"></script>
<script src="common.js"></script>
<script>
const map = L.map("map", {zoomControl: false, worldCopyJump: true, minZoom: 2}).setView([30, 10], 2);
L.control.zoom({position: "bottomright"}).addTo(map);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {maxZoom: 18, attribution: "&copy; OpenStreetMap contributors"}).addTo(map);

const layer = L.layerGroup().addTo(map);
let shown = [], on = null;
for (const r of ROWS) {
  r.pin = L.marker([r.lat, r.lon], {icon: L.divIcon({className: "pin", iconSize: [0, 0], html: `<div>${short(r.usd)}</div>`})});
  r.pin.on("click", () => select(r, true));
}

function select(r, scroll){
  if (on) { on.pin.getElement()?.classList.remove("on"); on.el?.classList.remove("on"); }
  on = r;
  r.pin.getElement()?.classList.add("on"); r.pin.setZIndexOffset(1000);
  r.el.classList.add("on");
  if (scroll) r.el.scrollIntoView({block: "nearest", behavior: "smooth"});
  else map.panTo(r.pin.getLatLng());
}

function render(){
  const t = $("type").value, mx = +$("max").value, where = $("where").value, q = $("q").value.trim().toLowerCase();
  shown = ROWS.filter(r => (!t || t.includes(r.type)) && r.usd <= mx && (!where || CONTINENT[r.cc] === where)
    && (!q || place(r).toLowerCase().includes(q)));
  layer.clearLayers(); on = null;
  for (const r of shown) r.pin.addTo(layer);
  $("count").innerHTML = `<span><b>${shown.length}</b> listings, cheapest first</span><span>Hover a row to find it</span>`;
  $("items").innerHTML = "";
  for (const r of shown) {
    const el = r.el = document.createElement("div");
    el.className = "item"; el.tabIndex = 0;
    el.innerHTML = `<div><div class="price">${usd(r.usd)}</div>${ownPrice(r) ? `<div class="own">${ownPrice(r)}</div>` : ""}</div>
      <div><div class="place">${esc(place(r))}</div><div class="t">${esc(r.title)}</div></div>
      <div class="meta">${acres(r.acres)} acres, ${TYPES[r.type].toLowerCase()}${r.tags.includes("R") ? `, <span class="tag">ruin</span>` : ""}</div>
      <a class="open" href="${esc(r.url)}" target="_blank" rel="noopener">Open on ${SRC[r.src]}</a>`;
    el.addEventListener("mouseenter", () => select(r, false));
    el.addEventListener("focus", () => select(r, false));
    $("items").appendChild(el);
  }
  if (shown.length) map.fitBounds(L.latLngBounds(shown.map(r => [r.lat, r.lon])).pad(.15), {maxZoom: 8, animate: false});
}
for (const id of ["type", "max", "where", "q"]) $(id).addEventListener("input", render);
// the selects size to their words, so the sentence doesn't have gaps
const fit = s => { const m = document.createElement("span"); m.style.cssText = "position:absolute;visibility:hidden;font:inherit;font-weight:700"; m.textContent = s.selectedOptions[0].text; s.parentNode.appendChild(m); s.style.width = m.offsetWidth + 8 + "px"; m.remove(); };
for (const s of document.querySelectorAll(".sentence select")) { fit(s); s.addEventListener("input", () => fit(s)); }
render();
</script>
</body>
</html>
