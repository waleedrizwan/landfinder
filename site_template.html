<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cheapest Land</title>
<meta name="description" content="The cheapest land listings worldwide, sorted by total price and updated daily.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#fff;--fg:#222;--muted:#666;--line:#ddd;--card:#fff;--link:#1a5fb4;--warn:#b54708}
@media (prefers-color-scheme:dark){
  :root{--bg:#121212;--fg:#e6e6e6;--muted:#9a9a9a;--line:#333;--card:#1c1c1c;--link:#78aeed;--warn:#f0a050}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
header{border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:56px}
header h1{font-size:18px;margin:0}
.tabs{display:flex;gap:4px}
.tabs button{font:inherit;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:16px 10px 14px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg);font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 12px}
.bar input,.bar select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:9px 12px}
.bar #q{flex:1 1 320px;min-width:0}
.bar #fmax{width:150px}
.count{color:var(--muted);font-size:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:4px}
.card .p{font-size:20px;font-weight:600}
.card .m{color:var(--muted);font-size:14px}
.card .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .w{color:var(--warn);font-size:13px}
.more{display:block;margin:20px auto 40px;font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:9px 18px;cursor:pointer}
#map{height:calc(100vh - 170px);min-height:400px;border:1px solid var(--line);border-radius:8px;margin-bottom:16px}
.note{color:var(--muted);font-size:13px;margin:0 0 24px}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px;padding:16px 0 32px}
footer p{margin:4px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Cheapest Land</h1>
  <nav class="tabs" role="tablist">
    <button role="tab" id="t-list" aria-selected="true">Listings</button>
    <button role="tab" id="t-map" aria-selected="false">Heat map</button>
  </nav>
</div></header>

<main class="wrap">
  <div class="bar">
    <input id="q" type="search" placeholder="Search by town, region, country or title" aria-label="Search">
    <select id="fc" aria-label="Country"><option value="">All countries</option></select>
    <input id="fmax" type="number" min="0" step="100" inputmode="numeric" placeholder="Max price $" aria-label="Max price in USD">
  </div>

  <section id="p-list">
    <div class="count" id="count">Loading…</div>
    <div class="grid" id="grid"></div>
    <button class="more" id="more" type="button" hidden>Show more</button>
  </section>

  <section id="p-map" hidden>
    <div id="map"></div>
    <p class="note">Where the matching listings are. US listings from LandWatch don't include coordinates, so they aren't on the map.</p>
  </section>
</main>

<footer><div class="wrap">
  <p id="updated"></p>
  <p>Prices converted to USD. Check access, zoning, title and foreign-ownership rules before buying. Sources: Properstar, LandWatch, Kijiji.</p>
</div></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
<script>
// row: [usdPerAcre, priceUsd, acres, cc, region, title, source, flags, url, lat, lon]
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let regionNames; try { regionNames = new Intl.DisplayNames(["en"], {type:"region"}); } catch (e) {}
const cname = cc => { if (cc && cc.length === 2) { try { return regionNames.of(cc) || cc; } catch (e) {} } return (cc || "").replace(/-/g, " ").replace(/\b\w/g, c => c.toUpperCase()); };
const money = v => v == null ? "—" : "$" + (v < 10 ? v.toFixed(2) : Math.round(v).toLocaleString("en-US"));
const acres = v => v < 1 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : Math.round(v).toLocaleString("en-US");
const srcName = s => ({properstar:"Properstar", landwatch:"LandWatch", kijiji:"Kijiji"})[s] || s;
const PAGE = 60;

// buyable at the listed price: no warning flags ("N" = no area listed is fine when ranking by total price)
const clean = r => r[1] != null && (!r[7] || r[7] === "N");

let ALL = [], VIEW = [], shown = PAGE, map, heat;

fetch("data.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(d => {
  ALL = d.rows.filter(clean).sort((a, b) => a[1] - b[1]);
  for (const r of ALL) r.text = (r[5] + " " + r[4] + " " + cname(r[3])).toLowerCase();
  $("updated").textContent = `Updated ${new Date(d.generated).toLocaleString("en-US", {dateStyle:"medium", timeStyle:"short"})}.`;
  const cs = [...new Set(ALL.map(r => r[3]))].sort((a, b) => cname(a).localeCompare(cname(b)));
  for (const cc of cs) $("fc").add(new Option(cname(cc), cc));
  for (const id of ["q", "fc", "fmax"]) $(id).addEventListener("input", () => { shown = PAGE; update(); });
  update();
}).catch(() => { $("count").textContent = "Couldn't load listings. Refresh to try again."; });

$("more").onclick = () => { shown += PAGE; renderGrid(); };
$("t-list").onclick = () => tab("list");
$("t-map").onclick = () => tab("map");

function tab(name){
  for (const t of ["list", "map"]) { $("t-" + t).setAttribute("aria-selected", t === name); $("p-" + t).hidden = t !== name; }
  if (name === "map") { initMap(); map.invalidateSize(); renderHeat(); }
}

function update(){
  const q = $("q").value.trim().toLowerCase(), cc = $("fc").value, mx = parseFloat($("fmax").value);
  VIEW = ALL.filter(r => (!cc || r[3] === cc) && (isNaN(mx) || r[1] <= mx) && (!q || r.text.includes(q)));
  renderGrid();
  if (map && !$("p-map").hidden) renderHeat();
}

function renderGrid(){
  $("count").textContent = `${VIEW.length.toLocaleString("en-US")} listings, cheapest first`;
  $("grid").innerHTML = VIEW.slice(0, shown).map(r => `<div class="card">
    <div class="p">${money(r[1])}</div>
    <div class="m">${r[2] != null ? acres(r[2]) + (r[2] === 1 ? " acre" : " acres") + " · " + money(r[0]) + "/acre" : "Area not listed"}</div>
    <a class="t" href="${esc(r[8])}" target="_blank" rel="noopener">${esc(r[5] || "View listing")}</a>
    <div class="m">${esc([r[4], cname(r[3])].filter(Boolean).join(", "))} · ${srcName(r[6])}</div>
  </div>`).join("");
  $("more").hidden = shown >= VIEW.length;
}

function initMap(){
  if (map || !window.L) return;
  map = L.map("map", {worldCopyJump: true}).setView([20, 0], 2);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {maxZoom: 18, attribution: "&copy; OpenStreetMap contributors"}).addTo(map);
}

function renderHeat(){
  if (!map || !L.heatLayer) return;
  const pts = VIEW.filter(r => r[9] != null && r[10] != null).map(r => [r[9], r[10], 1]);
  if (heat) map.removeLayer(heat);
  heat = L.heatLayer(pts, {radius: 18, blur: 15, maxZoom: 8}).addTo(map);
}
</script>
</body>
</html>
